name: Poster composition

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compose:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r wedding-sketch-poster/scripts/requirements.txt
      - run: python -B wedding-sketch-poster/scripts/install_fonts.py
      - run: python -B -m unittest discover -s tests -v
